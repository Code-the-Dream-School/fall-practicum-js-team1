name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-build:
    name: Backend - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  frontend-lint:
    name: Frontend - lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify required npm scripts
        run: |
          node -e "
            const scripts = require('./package.json').scripts || {};
            const required = ['lint'];
            const missing = required.filter(s => !scripts[s]);
            if (missing.length) {
              console.error('Missing required npm scripts:', missing.join(', '));
              process.exit(1);
            }
          "

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  frontend-build:
    name: Frontend - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify required npm scripts
        run: |
          node -e "
            const scripts = require('./package.json').scripts || {};
            const required = ['build'];
            const missing = required.filter(s => !scripts[s]);
            if (missing.length) {
              console.error('Missing required npm scripts:', missing.join(', '));
              process.exit(1);
            }
          "

      - name: Build frontend
        run: npm run build